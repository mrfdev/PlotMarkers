plugins {
    id "java"
    id "com.gradleup.shadow" version "9.3.2"
}

group = "com.bobcat00"
version = "2.0.2"
description = "Add PlotSquared plot markers to BlueMap"

def javaTarget = 25
def paperTarget = "26.2"
def buildNumber = providers.exec {
    commandLine "git", "rev-list", "--count", "HEAD"
}.standardOutput.asText.get().trim().padLeft(3, "0")
def artifactBaseName = "1MB-PlotMarkers-v${version}-${buildNumber}-j${javaTarget}-${paperTarget}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaTarget)
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperTarget}.build.60-beta"
    compileOnly "com.intellectualsites.plotsquared:plotsquared-core:7.5.12"
    compileOnly "com.sk89q.worldedit:worldedit-core:7.4.4"
    compileOnly "de.bluecolored:bluemap-api:2.7.8"

    implementation "com.technicjelle:BMUtils:5.0.1"
    implementation "org.bstats:bstats-bukkit:3.1.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(javaTarget)
}

tasks.named("processResources") {
    def props = [version: project.version]
    inputs.properties(props)
    filteringCharset = "UTF-8"
    filesMatching("plugin.yml") {
        expand(props)
    }
}

tasks.named("jar") {
    archiveFileName.set("${artifactBaseName}-thin.jar")
    manifest {
        attributes("paperweight-mappings-namespace": "mojang")
    }
}

tasks.named("shadowJar") {
    archiveFileName.set("${artifactBaseName}.jar")
    relocate "com.technicjelle", "com.bobcat00.plotmarkers.technicjelle"
    relocate "org.bstats", "com.bobcat00.plotmarkers.bstats"
    manifest {
        attributes("paperweight-mappings-namespace": "mojang")
    }
}

tasks.named("build") {
    dependsOn(tasks.named("shadowJar"))
}
